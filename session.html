<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Your Session — Starke Foundry</title>
<link type="text/css" rel="stylesheet" href="https://source.zoom.us/3.1.6/css/bootstrap.css" />
<link type="text/css" rel="stylesheet" href="https://source.zoom.us/3.1.6/css/react-select.css" />
<style>
  html,body{margin:0;height:100%}
  #foundry-loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0b0a;color:#f3ede6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;z-index:2}
  #foundry-loading .k{font-size:11px;letter-spacing:.34em;color:#e8763a;font-weight:700}
  #foundry-loading h1{font-family:Georgia,serif;font-size:26px;letter-spacing:.1em;margin:6px 0 14px}
  #foundry-loading h1 span{color:#e8763a}
  #foundry-loading p{color:#b8afa5;font-size:15px;max-width:460px;text-align:center;line-height:1.6}
  .spin{width:26px;height:26px;border:3px solid #2a2523;border-top-color:#e8763a;border-radius:50%;animation:sp 1s linear infinite;margin-bottom:18px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="foundry-loading">
  <div class="spin"></div>
  <div class="k">STARKE FOUNDRY</div>
  <h1>FO<span>U</span>NDRY</h1>
  <p id="msg">Connecting you to your coaching session&hellip;</p>
</div>

<script src="https://source.zoom.us/3.1.6/lib/vendor/react.min.js"></script>
<script src="https://source.zoom.us/3.1.6/lib/vendor/react-dom.min.js"></script>
<script src="https://source.zoom.us/3.1.6/lib/vendor/redux.min.js"></script>
<script src="https://source.zoom.us/3.1.6/lib/vendor/redux-thunk.min.js"></script>
<script src="https://source.zoom.us/3.1.6/lib/vendor/lodash.min.js"></script>
<script src="https://source.zoom.us/3.1.6/zoom-meeting-3.1.6.min.js"></script>
<script>
(function(){
  function qp(k){ try{ return new URLSearchParams(location.search).get(k) || ""; }catch(e){ return ""; } }
  function msg(t,err){ var el=document.getElementById("msg"); if(el){ el.innerHTML=t; if(err) el.style.color="#e8763a"; } var sp=document.querySelector(".spin"); if(sp&&err) sp.style.display="none"; }
  var mn = qp("mn").replace(/\D/g,"");
  var pwd = qp("pwd");
  var name = qp("name") || "Foundry Member";
  var leave = qp("leave") || "https://foundry.ethanstarke.com/";
  if(!mn){ msg("This session link is missing its meeting number. Please use the link from your portal.", true); return; }
  if(typeof ZoomMtg === "undefined"){ msg("Could not load the meeting client. Check your connection and refresh.", true); return; }

  fetch("https://www.ethanstarke.com/_functions/zoomSig?cb=" + Date.now(), {
    method: "POST",
    cache: "no-store",
    body: JSON.stringify({ meetingNumber: mn })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(!d || !d.signature){ throw new Error((d && d.error) || "no signature returned"); }
    ZoomMtg.preLoadWasm();
    ZoomMtg.prepareWebSDK();
    ZoomMtg.init({
      leaveUrl: leave,
      patchJsMedia: true,
      disableCORP: !window.crossOriginIsolated,
      success: function(){
        var l=document.getElementById("foundry-loading"); if(l) l.style.display="none";
        ZoomMtg.join({
          sdkKey: d.sdkKey,
          signature: d.signature,
          meetingNumber: mn,
          userName: name,
          passWord: pwd,
          success: function(){},
          error: function(e){ var l=document.getElementById("foundry-loading"); if(l) l.style.display="flex"; msg("Could not join the session. It may not have started yet, or the number is wrong.", true); }
        });
      },
      error: function(e){ msg("The meeting client failed to start. Please refresh and try again.", true); }
    });
  })
  .catch(function(e){ msg("We couldn't start your session right now. Please try again shortly.", true); });
})();
</script>
</body>
</html>
