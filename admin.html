<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Desk &middot; Starke Foundry</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0d0b0a; --panel:#161311; --panel2:#1d1917; --line:#2a2523;
    --ink:#f3ede6; --dim:#b8afa5; --faint:#8a807a;
    --ember:#e8763a; --ember2:#f0a35e; --gold:#c9a24a; --ok:#7bbf6a; --bad:#d9705f;
    --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(1100px 560px at 50% -12%, rgba(232,118,58,0.08), transparent 60%); min-height:100vh;}
  a{color:var(--ember2)}
  .wrap{max-width:1080px; margin:0 auto; padding:32px 22px 80px}
  .brand{display:flex; align-items:baseline; gap:12px; margin-bottom:6px}
  .brand .k{font-size:11px; letter-spacing:0.34em; color:var(--ember); font-weight:700}
  .brand h1{font-family:var(--serif); font-weight:600; font-size:22px; letter-spacing:0.14em; margin:0}
  .brand h1 span{color:var(--ember)}

  #gate{max-width:420px; margin:8vh auto 0; text-align:center}
  #gate h2{font-family:var(--serif); font-weight:500; font-size:26px; margin:18px 0 6px}
  #gate p{color:var(--dim); font-size:14px; margin:0 0 22px}
  .field{display:flex; gap:10px}
  input[type=password],input[type=number]{background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:12px 14px; font-family:var(--sans); font-size:15px}
  input[type=password]{flex:1}
  input:focus{outline:none; border-color:var(--ember)}
  button{background:linear-gradient(180deg,var(--ember2),var(--ember)); color:#1a120c; font-weight:600;
    border:none; border-radius:10px; padding:12px 18px; font-size:14.5px; cursor:pointer; font-family:var(--sans)}
  button.ghost{background:transparent; color:var(--dim); border:1px solid var(--line)}
  button.mini{padding:7px 12px; font-size:12.5px; border-radius:8px}
  button.mini.reject{background:transparent; color:var(--bad); border:1px solid #4a2a26}
  button.mini.save{background:transparent; color:var(--ink); border:1px solid var(--line)}
  button:disabled{opacity:.55; cursor:default}
  select{background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:7px 10px; font-family:var(--sans); font-size:13px}
  #gateErr{color:var(--bad); font-size:13px; margin-top:14px; min-height:18px}

  #desk{display:none}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:8px}
  .stats{display:flex; gap:10px; flex-wrap:wrap}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 16px; min-width:104px}
  .stat b{display:block; font-family:var(--serif); font-size:22px; color:var(--ember2)}
  .stat span{font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--faint)}
  #deskMsg{min-height:18px; font-size:13px; margin:4px 0 6px}
  #deskMsg.ok{color:var(--ok)} #deskMsg.bad{color:var(--bad)}
  .tabs{display:flex; gap:6px; margin:8px 0 18px; border-bottom:1px solid var(--line)}
  .tab{padding:9px 14px; font-size:13.5px; color:var(--dim); cursor:pointer; border-bottom:2px solid transparent}
  .tab.on{color:var(--ink); border-bottom-color:var(--ember)}
  .card{background:linear-gradient(180deg,var(--panel),#131010); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-bottom:12px}
  .row1{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .nm{font-family:var(--serif); font-size:17px; font-weight:600}
  .em{color:var(--dim); font-size:13px}
  .meta{color:var(--faint); font-size:12px; margin-top:2px}
  .pill{display:inline-block; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; padding:2px 9px;
    border-radius:999px; border:1px solid var(--line); color:var(--dim)}
  .pill.stage{border-color:#3a2f23; color:var(--ember2)}
  .pill.ok{border-color:#2f4a2a; color:var(--ok)}
  .pill.warn{border-color:#4a3a1f; color:var(--gold)}
  details{margin-top:10px}
  details summary{cursor:pointer; color:var(--faint); font-size:12.5px}
  pre{white-space:pre-wrap; word-break:break-word; background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:12px; margin:10px 0 0; font-family:var(--sans); font-size:12.5px; color:var(--dim)}
  .acts{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:14px; padding-top:12px; border-top:1px solid var(--line)}
  .acts .lbl{font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--faint)}
  .acts.done{color:var(--faint); font-size:12.5px; text-transform:uppercase; letter-spacing:0.08em}
  .sec{font-family:var(--serif); font-size:16px; margin:14px 0 10px; color:var(--dim)}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
  th{color:var(--faint); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; font-weight:600}
  .cellacts{display:flex; align-items:center; gap:6px}
  .empty{color:var(--faint); font-size:13.5px; padding:24px 4px}
  .cwk{border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:10px 0}
  .cwkh{font-family:var(--serif); font-size:15px; margin-bottom:6px}
  .cflab{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--faint); margin:9px 0 3px}
  .cfin{width:100%; box-sizing:border-box; background:rgba(0,0,0,0.22); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-family:inherit; font-size:13px; line-height:1.45; resize:vertical}
  .cwk .save{margin-top:12px}
  .foot{margin-top:34px; color:var(--faint); font-size:12px; letter-spacing:0.04em}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="k">STARKE</div><h1>FO<span>U</span>NDRY &middot; The Desk</h1></div>

  <div id="gate">
    <h2>The Desk is sealed.</h2>
    <p>Enter the desk key to open the applications, founders, and payments.</p>
    <div class="field"><input id="tok" type="password" placeholder="Desk key" autocomplete="off" /><button id="open">Open</button></div>
    <div id="gateErr"></div>
  </div>

  <div id="desk">
    <div class="bar">
      <div class="stats" id="stats"></div>
      <button class="ghost" id="refresh">Refresh</button>
    </div>
    <div id="deskMsg"></div>
    <div class="tabs">
      <div class="tab on" data-t="apps">Applications</div>
      <div class="tab" data-t="founders">Founders</div>
      <div class="tab" data-t="coaches">Coaches</div>
      <div class="tab" data-t="payments">Payments</div>
      <div class="tab" data-t="curriculum">Curriculum</div><div class="tab" data-t="ship">Ship</div>
    </div>
    <div id="view"></div>
    <div class="foot">Operating desk on the Supabase backend. Admit &amp; place opens an awaiting-payment seat; payment turns it active.</div>
  </div>
</div>

<script>
(function(){
  var BASE = "https://dxkmdjdkwmarifzelakr.supabase.co/functions/v1/";
  var READ = BASE + "admin-data";
  var WRITE = BASE + "admin-write";
  var CERTIFY = BASE + "admin-certify";
  var CURR = BASE + "admin-curriculum";
  var STAGES = ["Seeker","Builder","Sovereign"];
  var token = "", DATA = null, TAB = "apps";

  var gate = document.getElementById("gate"), desk = document.getElementById("desk"),
      err = document.getElementById("gateErr"), deskMsg = document.getElementById("deskMsg");

  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function money(c){ if(c==null) return "—"; return "$"+(c/100).toLocaleString("en-US",{minimumFractionDigits:0}); }
  function when(s){ if(!s) return ""; try{ return new Date(s).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }catch(e){ return s; } }
  function stPill(s){ var c=(s==="active"||s==="welcomed"||s==="paid")?"ok":((s==="rejected"||s==="blocked"||s==="unpaid"||s==="awaiting_payment")?"warn":""); return '<span class="pill '+c+'">'+esc(s||"—")+'</span>'; }
  function stageSel(cls,id,cur){ return '<select class="'+cls+'" data-id="'+id+'">'+STAGES.map(function(s){return '<option'+((cur===s)?' selected':'')+'>'+s+'</option>';}).join('')+'</select>'; }
  function msg(t,ok){ deskMsg.className = ok?"ok":"bad"; deskMsg.textContent = t||""; if(t) setTimeout(function(){ if(deskMsg.textContent===t) deskMsg.textContent=""; }, 4000); }

  function load(){
    err.textContent = "Opening…";
    return fetch(READ, { headers: { "x-admin-token": token } })
      .then(function(r){ if(r.status===401) throw new Error("Wrong desk key."); if(!r.ok) throw new Error("Server error ("+r.status+")."); return r.json(); })
      .then(function(j){ DATA=j; gate.style.display="none"; desk.style.display="block"; render(); })
      .catch(function(e){ err.textContent=e.message||"Could not open."; token=""; });
  }

  async function doWrite(payload, btn){
    if(btn){ btn.disabled=true; }
    try{
      var r = await fetch(WRITE, { method:"POST", headers:{ "x-admin-token": token, "Content-Type":"application/json" }, body: JSON.stringify(payload) });
      var j = await r.json();
      if(!r.ok || j.error){ msg("Action failed: "+(j.error||r.status), false); if(btn) btn.disabled=false; return; }
      msg("Done.", true); await load();
    }catch(e){ msg("Action failed: "+e.message, false); if(btn) btn.disabled=false; }
  }

  async function doCertify(founderId, btn){
    if(!confirm("Confer the certificate for their current chamber? This assigns a permanent credential ID and publishes them to the registry.")) return;
    if(btn){ btn.disabled=true; }
    try{
      var r = await fetch(CERTIFY, { method:"POST", headers:{ "x-admin-token": token, "Content-Type":"application/json" }, body: JSON.stringify({ founder_id: founderId }) });
      var j = await r.json();
      if(!r.ok || j.error){ msg("Certify failed: "+(j.error||r.status), false); if(btn) btn.disabled=false; return; }
      msg("Certified "+(j.credential_id||"")+(j.already?" (already on record)":"")+".", true); await load();
    }catch(e){ msg("Certify failed: "+e.message, false); if(btn) btn.disabled=false; }
  }

  function render(){
    if(!DATA) return;
    var c = DATA.counts || {applications:0,founders:0,payments:0};
    document.getElementById("stats").innerHTML = stat(c.applications,"Applications")+stat(c.founders,"Founders")+stat(c.payments,"Payments");
    var v = document.getElementById("view");
    if(TAB==="apps") v.innerHTML = renderApps(DATA.applications||[]);
    else if(TAB==="founders") v.innerHTML = renderFounders(DATA.founders||[], DATA.coaches||[]);
    else if(TAB==="coaches") v.innerHTML = renderCoaches(DATA.coach_applications||[], DATA.coaches||[]);
    else if(TAB==="curriculum"){ v.innerHTML = '<div class="empty">Loading curriculum…</div>'; loadCurriculum(); }
    else v.innerHTML = renderPayments(DATA.payments||[]);
  }

  function loadCurriculum(){
    fetch(CURR, { headers: { "x-admin-token": token } })
      .then(function(r){ return r.json(); })
      .then(function(j){ renderCurriculum(j.weeks||[]); })
      .catch(function(){ document.getElementById("view").innerHTML = '<div class="empty">Could not load curriculum.</div>'; });
  }
  function renderCurriculum(weeks){
    var v = document.getElementById("view");
    if(TAB!=="curriculum") return;
    if(!weeks.length){ v.innerHTML = '<div class="empty">No curriculum rows found.</div>'; return; }
    var fields = [["theme","Theme",0],["your_reading","Your reading",1],["market_reading","Market reading",1],["deliverable_prompt","Deliverable prompt",1],["done_looks_like","What done looks like",1],["brings_to_session","Brings to session",1]];
    var curStage = "", html = '<div class="foot" style="margin:0 0 8px">Edit any week and Save. Changes write straight to the live curriculum founders see. Seeker readings and all deliverables are drafts — refine them here.</div>';
    weeks.forEach(function(w){
      if(w.stage!==curStage){ curStage=w.stage; html += '<div class="sec">'+esc(curStage)+'</div>'; }
      html += '<div class="cwk"><div class="cwkh">Week '+w.week+' <span class="meta">&middot; stage week '+esc(w.stage_week||"")+'</span></div>'+
        fields.map(function(f){
          var val = esc(w[f[0]]||"");
          return '<label class="cflab">'+f[1]+'</label>'+
            (f[2] ? '<textarea class="cfin" data-cf="'+f[0]+'" data-cwk="'+w.week+'" rows="2">'+val+'</textarea>'
                  : '<input class="cfin" data-cf="'+f[0]+'" data-cwk="'+w.week+'" value="'+val+'" />');
        }).join('')+
        '<button class="mini save" data-cwk="'+w.week+'">Save week '+w.week+'</button></div>';
    });
    v.innerHTML = html;
  }
  function saveCurriculumWeek(week, btn){
    var payload = { week: parseInt(week,10) };
    Array.prototype.forEach.call(document.querySelectorAll('.cfin[data-cwk="'+week+'"]'), function(el){ payload[el.getAttribute("data-cf")] = el.value; });
    if(btn) btn.disabled = true;
    fetch(CURR, { method:"POST", headers:{ "x-admin-token": token, "Content-Type":"application/json" }, body: JSON.stringify(payload) })
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j && j.ok){ msg("Week "+week+" saved.", true); } else { msg("Save failed: "+((j&&j.error)||"unknown"), false); } if(btn) btn.disabled=false; })
      .catch(function(e){ msg("Save failed: "+e.message, false); if(btn) btn.disabled=false; });
  }
  function stat(n,l){ return '<div class="stat"><b>'+(n||0)+'</b><span>'+l+'</span></div>'; }

  function appActions(x){
    if(x.status==="submitted"){
      return '<div class="acts"><span class="lbl">Place in</span>'+stageSel("chsel", x.id, x.stage_placed||"Seeker")+
        '<button class="mini" data-act="admit" data-id="'+x.id+'">Admit &amp; place</button>'+
        '<button class="mini reject" data-act="reject" data-id="'+x.id+'">Reject</button></div>';
    }
    if(x.decision) return '<div class="acts done">'+esc(x.decision)+(x.stage_placed?(" &middot; "+esc(x.stage_placed)):"")+'</div>';
    return '';
  }
  function renderApps(a){
    if(!a.length) return '<div class="empty">No applications yet.</div>';
    return a.map(function(x){
      return '<div class="card"><div class="row1"><div>'+
        '<div class="nm">'+esc(x.name||"(no name)")+'</div>'+
        '<div class="em">'+esc(x.email||"")+(x.phone?" &middot; "+esc(x.phone):"")+(x.address?" &middot; "+esc(x.address):"")+'</div>'+
        '<div class="meta">'+when(x.created_at)+'</div></div>'+
        '<div style="text-align:right"><span class="pill stage">'+esc(x.stage_placed||"—")+'</span> '+stPill(x.status)+'</div></div>'+
        (x.essays?('<details><summary>Read application</summary><pre>'+esc(x.essays)+'</pre></details>'):'')+
        (x.proof?('<details><summary>Evidence / links</summary><pre>'+esc(x.proof)+'</pre></details>'):'')+
        appActions(x)+'</div>';
    }).join("");
  }
  function renderFounders(f, coaches){
    if(!f.length) return '<div class="empty">No founders yet. Admitting an application opens a seat here; payment turns it active.</div>';
    return '<table><thead><tr><th>Name</th><th>Email</th><th>Chamber</th><th>Week</th><th>Standing</th><th>Coach</th><th>Placement</th></tr></thead><tbody>'+
      f.map(function(x){ return '<tr><td>'+esc(x.name||"—")+'</td><td class="em">'+esc(x.email||"")+'</td>'+
        '<td>'+stPill_stage(x.stage)+'</td><td>'+(x.week||1)+'</td><td>'+stPill(x.status)+'</td>'+
        '<td>'+coachSelect(x, coaches||[])+'</td>'+
        '<td><div class="cellacts">'+stageSel("fstage", x.id, x.stage||"Seeker")+
        '<input class="fweek" data-id="'+x.id+'" type="number" min="1" value="'+(x.week||1)+'" style="width:56px" />'+
        '<button class="mini save" data-fact="place" data-id="'+x.id+'">Save</button>'+
        '<button class="mini" data-fact="certify" data-id="'+x.id+'" title="Confer certificate + publish to registry">Certify</button></div></td></tr>'; }).join("")+
      '</tbody></table>';
  }
  function coachSelect(f, coaches){
    var opts = '<option value="">— unassigned —</option>' + coaches.map(function(c){ return '<option value="'+c.id+'"'+((f.coach_id===c.id)?' selected':'')+'>'+esc(c.name||c.email||"coach")+'</option>'; }).join('');
    return '<select class="fcoach" data-id="'+f.id+'">'+opts+'</select>';
  }
  function coachAppActions(x){
    if(x.status==="submitted") return '<div class="acts"><button class="mini" data-cact="admit_coach" data-id="'+x.id+'">Admit to Bench</button><button class="mini reject" data-cact="reject_coach" data-id="'+x.id+'">Reject</button></div>';
    return '<div class="acts done">'+esc(x.status)+'</div>';
  }
  function renderCoaches(apps, roster){
    var out = '<div class="sec">On the Bench ('+roster.length+')</div>';
    if(!roster.length) out += '<div class="empty">No coaches on the Bench yet.</div>';
    else out += '<table><thead><tr><th>Name</th><th>Email</th><th>Lane</th><th>Tier</th><th>Capacity</th></tr></thead><tbody>'+
      roster.map(function(c){ return '<tr><td>'+esc(c.name||"—")+'</td><td class="em">'+esc(c.email||"")+'</td><td>'+esc(c.primary_lane||"—")+'</td><td>'+esc(c.tier||"—")+'</td><td>'+(c.capacity||6)+'</td></tr>'; }).join('')+'</tbody></table>';
    out += '<div class="sec" style="margin-top:22px">Applications ('+apps.length+')</div>';
    if(!apps.length) return out + '<div class="empty">No coach applications yet.</div>';
    return out + apps.map(function(x){
      return '<div class="card"><div class="row1"><div>'+
        '<div class="nm">'+esc(x.name||"(no name)")+'</div>'+
        '<div class="em">'+esc(x.email||"")+(x.phone?" &middot; "+esc(x.phone):"")+'</div>'+
        '<div class="meta">'+when(x.created_at)+(x.primary_lane?(" &middot; "+esc(x.primary_lane)):"")+(x.tier_claim?(" &middot; "+esc(x.tier_claim)):"")+'</div></div>'+
        '<div style="text-align:right">'+stPill(x.status)+'</div></div>'+
        (x.headline_outcome?('<details><summary>Headline outcome</summary><pre>'+esc(x.headline_outcome)+'</pre></details>'):'')+
        (x.bar_cleared?('<details><summary>The bar cleared</summary><pre>'+esc(x.bar_cleared)+'</pre></details>'):'')+
        (x.founders_developed?('<details><summary>Founders developed</summary><pre>'+esc(x.founders_developed)+'</pre></details>'):'')+
        (x.work_sample?('<div class="meta" style="margin-top:8px">Work: <a href="'+esc(x.work_sample)+'" target="_blank" rel="noopener">'+esc(x.work_sample)+'</a></div>'):'')+
        coachAppActions(x)+'</div>';
    }).join('');
  }
  function stPill_stage(s){ return '<span class="pill stage">'+esc(s||"—")+'</span>'; }
  function renderPayments(p){
    if(!p.length) return '<div class="empty">No payments recorded yet.</div>';
    return '<table><thead><tr><th>Email</th><th>Chamber</th><th>Amount</th><th>Status</th><th>When</th></tr></thead><tbody>'+
      p.map(function(x){ return '<tr><td class="em">'+esc(x.email||"")+'</td><td>'+stPill_stage(x.stage)+'</td><td>'+money(x.amount)+'</td><td>'+stPill(x.status)+'</td><td class="meta">'+when(x.created_at)+'</td></tr>'; }).join("")+
      '</tbody></table>';
  }

  // event delegation for action buttons
  document.getElementById("view").addEventListener("click", function(e){
    var b = e.target && e.target.closest ? e.target.closest("button[data-act],button[data-fact],button[data-cact],button[data-cwk]") : null;
    if(!b) return;
    if(b.hasAttribute("data-cwk")){ saveCurriculumWeek(b.getAttribute("data-cwk"), b); return; }
    var id = b.getAttribute("data-id");
    if(b.hasAttribute("data-act")){
      var act = b.getAttribute("data-act");
      var payload = { action: act, application_id: id };
      if(act==="admit"){ var s=document.querySelector('.chsel[data-id="'+id+'"]'); payload.stage = s?s.value:"Seeker"; }
      doWrite(payload, b);
    } else if(b.hasAttribute("data-cact")){
      doWrite({ action: b.getAttribute("data-cact"), coach_application_id: id }, b);
    } else if(b.getAttribute("data-fact")==="place"){
      var st=document.querySelector('.fstage[data-id="'+id+'"]'), wk=document.querySelector('.fweek[data-id="'+id+'"]');
      doWrite({ action:"place", founder_id:id, stage: st?st.value:undefined, week: wk?parseInt(wk.value,10):undefined }, b);
    } else if(b.getAttribute("data-fact")==="certify"){
      doCertify(id, b);
    }
  });
  document.getElementById("view").addEventListener("change", function(e){
    var s = e.target;
    if(s && s.classList && s.classList.contains("fcoach")){
      doWrite({ action:"assign_coach", founder_id: s.getAttribute("data-id"), coach_id: s.value || null });
    }
  });

  document.getElementById("open").addEventListener("click", function(){ token=document.getElementById("tok").value.trim(); if(token) load(); });
  document.getElementById("tok").addEventListener("keydown", function(e){ if(e.key==="Enter"){ token=this.value.trim(); if(token) load(); } });
  document.getElementById("refresh").addEventListener("click", function(){ if(token) load(); });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
    t.addEventListener("click", function(){ Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(o){o.classList.remove("on");}); t.classList.add("on"); TAB=t.getAttribute("data-t"); render(); });
  });
})();
</script>

<script>
(function(){
  var ORDERS="https://dxkmdjdkwmarifzelakr.supabase.co/functions/v1/admin-orders";
  function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c];});}
  function loadShip(){
    var view=document.getElementById("view"); if(!view)return;
    view.innerHTML='<div style="padding:8px 0;color:#8a807a">Loading book orders...</div>';
    fetch(ORDERS,{headers:{"x-admin-token":(typeof token!=="undefined"?token:"")}})
      .then(function(r){return r.json();})
      .then(function(d){
        if(!d||d.error){view.innerHTML='<div style="color:#d9705f;padding:8px 0">'+esc(d&&d.error||"error")+'</div>';return;}
        var rows=d.orders||[], sum=d.summary||{};
        var chips=Object.keys(sum).map(function(k){return '<span style="display:inline-block;margin:0 8px 6px 0;padding:3px 10px;border:1px solid #2a2523;border-radius:20px;font-size:12px;color:#b8afa5">'+esc(k)+': '+sum[k]+'</span>';}).join("");
        var head='<tr style="text-align:left;color:#8a807a;font-size:12px"><th style="padding:8px 10px">Founder</th><th>Stage</th><th>Mv</th><th>Books</th><th>Status</th><th>Ship to</th><th>Zinc id</th><th>When</th></tr>';
        var body=rows.map(function(o){
          var st=o.status||"";
          var col=st==="placed"?"#7bbf6a":(st==="failed"?"#d9705f":(String(st).indexOf("needs")===0?"#e8a33e":"#b8afa5"));
          var ship=o.has_address?(esc(o.ship_city)+(o.ship_state?", "+esc(o.ship_state):"")):'<span style="color:#e8a33e">no address</span>';
          var when=o.created_at?esc(String(o.created_at).slice(0,10)):"";
          return '<tr style="border-top:1px solid #1d1917"><td style="padding:8px 10px">'+esc(o.founder_name||o.founder_email||"-")+'<div style="color:#6b625c;font-size:11px">'+esc(o.founder_email)+'</div></td><td>'+esc(o.stage)+'</td><td>'+esc(o.movement)+'</td><td>'+esc(o.book_count)+'</td><td style="color:'+col+'">'+esc(st)+'</td><td>'+ship+'</td><td style="font-size:11px;color:#8a807a">'+esc(o.zinc_order_id)+'</td><td style="font-size:11px;color:#8a807a">'+when+'</td></tr>';
        }).join("");
        view.innerHTML='<div style="margin:6px 0 14px">'+chips+'</div><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">'+head+body+'</table></div>'+(rows.length?"":'<div style="color:#8a807a;padding:10px 0">No book orders yet.</div>');
      })
      .catch(function(e){view.innerHTML='<div style="color:#d9705f;padding:8px 0">'+esc(e)+'</div>';});
  }
  document.addEventListener("click",function(e){
    var b=e.target&&e.target.closest?e.target.closest('[data-t="ship"]'):null;
    if(!b)return; setTimeout(loadShip,0);
  });
})();
</script>
</body>
